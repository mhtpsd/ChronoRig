[project]
name = "chronorig-api"
version = "1.0.0"
description = "ChronoRig Autonomous Video-to-Physics Control Plane & Verifiable Agent Engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "numpy>=2.1.2",
    "opencv-python-headless>=4.10.0.84",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"